    <!-- Schema.org JSON-LD Structured Data for Mini Food Chopper -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org/",
      "@type": "Product",
      "name": "Wireless Electric Mini Food Chopper & Garlic Mincer",
      "image": [
        "/products/Screenshot_20260901_134903_Meesho.jpg",
        "/products/1788250324092.png",
        "/products/chopper-blades-precision.jpg",
        "/products/chopper-cordless-motor.jpg",
        "/products/chopper-washable-cleaning.jpg"
      ],
      "description": "Cordless portable USB rechargeable vegetable and food processor with 3-tier 304 stainless steel blades, one-touch pulse mincing in 5-10 seconds.",
      "sku": "SS-CHOP-01",
      "brand": {
        "@type": "Brand",
        "name": "SolveSpace India"
      },
      "offers": {
        "@type": "Offer",
        "url": "https://zyphorix7.github.io/solvespace-india/",
        "priceCurrency": "INR",
        "price": "899",
        "priceValidUntil": "2027-12-31",
        "availability": "https://schema.org/InStock",
        "itemCondition": "https://schema.org/NewCondition"
      },
      "aggregateRating": {
        "@type": "AggregateRating",
        "ratingValue": "4.92",
        "reviewCount": "186"
      }
    }
    </script>
    <!-- Single Page App redirect handler for GitHub Pages -->
    <script type="text/javascript">
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&') 
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
